name: CI
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configura Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Verifica arquivos obrigatórios
        shell: bash
        run: |
          test -f .gitignore || (echo ".gitignore ausente!" && exit 1)
          test -f README.md  || (echo "README.md ausente!" && exit 1)